<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        
        legend {
            font-weight: bold;
        }

        label {
            margin-right: 10px;
        }

        select {
            margin-right: 20px;
        }

        button {
            margin-top: 20px;
        }

        p {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <fieldset>
        <legend></legend>
        <label for="dataType">Data Type:</label>
        <select id="dataType">
            <option value="float32">float32</option>
            <option value="float16">float16</option>
        </select>
    </fieldset>

    <fieldset>
        <legend></legend>
        <label for="queryType">Query Type:</label>
        <select id="queryType">
            <option value="group query">Group query (group size=8)</option>
            <option value="single query">Single query (group size=1)</option>
        </select>
    </fieldset>

    <fieldset>
        <legend></legend>
        <label for="stage">Stage:</label>
        <select id="stage">
            <option value="Prefilling">Prefilling</option>
            <option value="Decoding">Decoding</option>
        </select>
    </fieldset>

    <fieldset>
        <legend></legend>
        <label for="sliding">Local Window Size:</label>
        <select id="sliding">
            <option value="-1">-1</option>
            <option value="16">16</option>
        </select>
    </fieldset>

    <button id="start">Start</button>
    <p id="log"></p>
    <script src="./onnxruntime-web/dist/ort.jspi.js"></script>
    <script>

        ort.env.wasm.simd = true;
        ort.env.wasm.proxy = false;
        ort.env.wasm.numThreads = 0;

        const log = document.getElementById('log');

        async function run(model_path, input, outputs, dim, dataType, stage, sliding_window) {
            log.innerHTML = 'start running model ' + model_path + "<br>";
            var feeds = {};
            let inputTensor;

            for (let index = 0; index < input.length; index++) {
                const element = input[index];
                console.log(index, element);
                const dim_ = dim[index];
                if (index > 4) {
                    if (index == 5) {
                        inputTensor = new ort.Tensor(
                            "int32",
                            new Int32Array([25]),
                            dim_
                        );
                    } else {
                        inputTensor = new ort.Tensor(
                            "int32",
                            new Int32Array([256]),
                            dim_
                        );
                    }
                } else if (index > 2) {
                    inputTensor = new ort.Tensor(
                        dataType,
                        stage === "Prefilling" ? generateBuffer(dataType, dim_, 0) : pastBuffer(dataType, dim_, 25),
                        dim_
                    );
                } else {
                    inputTensor = new ort.Tensor(
                        dataType,
                        // new Float32Array(genPastArr(dim_, 25)),
                        stage === "Decoding" ? randomBuffer(dataType, dim_) : pastBuffer(dataType, dim_, 25),
                        dim_
                    );
                }
                feeds[element] = inputTensor;
                console.log("input", inputTensor);
            }

            console.log('Creating session for webnn ep....');
            const sequence_length = stage === "Prefilling" ? 256 : 1;
            const session_webnn = await ort.InferenceSession.create(model_path, {
                executionProviders: [{ name: "webnn", deviceType: "gpu", powerPreference: "default" }],
                // logSeverityLevel: 0,
                freeDimensionOverrides: { "batch_size": 1, "sequence_length": sequence_length, "past_sequence_length": 256, "total_sequence_length": 256 },
            });
            console.log('...done.');
            console.log('Creating session for cpu ep....');
            const session = await ort.InferenceSession.create(model_path, {
                executionProviders: [{ name: "wasm", deviceType: 0, powerPreference: 1 }],
                // logSeverityLevel: 0,
            });
            console.log('...done.');
            const results = await session.run(feeds);
            console.log('cpu ep results: ', results);
            const results_webnn = await session_webnn.run(feeds);
            console.log('webnn ep results: ', results_webnn);
            console.log("finished run for", model_path);
            outputs.forEach(output => {
                result1 = results[output].data;
                result2 = results_webnn[output].data;
                let epsilon = 2e-5;
                difference = result1.map((x, i) => Math.abs(x - result2[i]));
                testResult = difference.every((x) => x < epsilon);
                max_diff = difference.sort().reverse()[0];
                console.log(difference.sort().reverse());
                log.innerHTML += output + " max difference: " + max_diff + "<br>";
            });

            log.innerHTML += "Run done.";
        };

        async function main(dataType, queryType, stage, sliding_window) {
            let model_path = "./models/GQA_";
            const input = ['query', 'key', 'value', 'past_key', 'past_value', 'seqlens_k'];
            const outputs = ['output', 'present_key', 'present_value'];
            let dim;
            if (queryType === "group query") {
                model_path += "group_";
                if (stage === "Prefilling") {
                    dim = [[1, 256, 2048], [1, 256, 256], [1, 256, 256], [1, 4, 256, 64], [1, 4, 256, 64], [1]];
                } else {
                    dim = [[1, 1, 2048], [1, 1, 256], [1, 1, 256], [1, 4, 256, 64], [1, 4, 256, 64], [1]];
                }
            } else {
                if (stage === "Prefilling") {
                    dim = [[1, 256, 3072], [1, 256, 3072], [1, 256, 3072], [1, 32, 256, 96], [1, 32, 256, 96], [1]];
                } else {
                    dim = [[1, 1, 3072], [1, 1, 3072], [1, 1, 3072], [1, 32, 256, 96], [1, 32, 256, 96], [1]];
                }
            }
            if (dataType === "float16") {
                model_path += "fp16_";
            }
            if (sliding_window === "-1") {
                model_path += "const.onnx";
            } else {
                model_path += "local.onnx";
            }
            await run(model_path, input, outputs, dim, dataType, stage, sliding_window);
        }

        const start = document.getElementById('start');
        start.onclick = async () => {
            const dataType = document.getElementById('dataType').value;
            const queryType = document.getElementById('queryType').value;
            const stage = document.getElementById('stage').value;
            const sliding_window = document.getElementById('sliding').value;
            await main(dataType, queryType, stage, sliding_window);
        };

        function sizeOfShape(shape) {
            return shape.reduce((a, b) => {
                return a * b;
            });
        }
        function generateBuffer(dataType, shape, value) {
            let buffer;
            const size = sizeOfShape(shape);
            switch (dataType) {
                case 'float32':
                    buffer = new Float32Array(size).fill(value);
                    break;
                case 'float16':
                    buffer = new Float16Array(size).fill(toFloat16(value));
                    break;
                case 'int32':
                    buffer = new Int32Array(size).fill(value);
                    break;
                case 'int64':
                    buffer = new BigInt64Array(size).fill(BigInt(value));
                    break;
                default:
                    throw new Error('Unsupported data type');
            }
            return buffer;
        }
        function randomBuffer(dataType, shape) {
            let buffer;
            const size = sizeOfShape(shape);
            switch (dataType) {
                case 'float32':
                    buffer = new Float32Array(size);
                    for (let i = 0; i < size; i++) {
                        buffer[i] = Math.random();
                    }
                    break;
                case 'float16':
                    buffer = new Float16Array(size);
                    for (let i = 0; i < size; i++) {
                        buffer[i] = toFloat16(Math.random());
                    }
                    break;
                default:
                    throw new Error('Unsupported data type');
            }

            return buffer;
        }
        function pastBuffer(dataType, shape, k) {
            let buffer;
            const size = sizeOfShape(shape);
            switch (dataType) {
                case 'float32':
                    buffer = new Float32Array(size);
                    for (let i = 0; i < size; i++) {
                        buffer[i] = 0;
                    }
                    for (let i = 0; i < shape[0]; i++) {
                        for (let j = 0; j < shape[1]; j++) {
                            for (let l = 0; l < k; l++) {
                                for (let m = 0; m < shape[3]; m++) {
                                    buffer[i * shape[1] * shape[2] * shape[3] + j * shape[2] * shape[3] + l * shape[3] + m] = Math.random();
                                }
                            }
                        }
                    }
                    break;
                case 'float16':
                    buffer = new Float16Array(size);
                    for (let i = 0; i < size; i++) {
                        buffer[i] = 0;
                    }
                    for (let i = 0; i < shape[0]; i++) {
                        for (let j = 0; j < shape[1]; j++) {
                            for (let l = 0; l < k; l++) {
                                for (let m = 0; m < shape[3]; m++) {
                                    buffer[i * shape[1] * shape[2] * shape[3] + j * shape[2] * shape[3] + l * shape[3] + m] = toFloat16(Math.random());
                                }
                            }
                        }
                    }
                    break;
                default:
                    throw new Error('Unsupported data type');
            }

            return buffer;
        }
        function toFloat16(value) {
            // 将 double 转换为 float16 的近似值
            const buffer = new ArrayBuffer(4);
            const view = new DataView(buffer);
            view.setFloat32(0, value, true); // 将 double 转换为 float32
            const float32Bits = view.getUint32(0, true); // 获取 float32 的位表示
            const sign = float32Bits & 0x80000000; // 符号位
            const mantissa = float32Bits & 0x007FFFFF; // 尾数部分
            let exponent = (float32Bits & 0x7F800000) >> 23; // 指数部分

            if (exponent === 0) {
                // 非规格化数
                if (mantissa === 0) {
                    return 0.0; // 零
                } else {
                    // 转换为规格化数
                    exponent = 127; // 最小的规格化指数
                    while ((mantissa & 0x800000) === 0) {
                        mantissa <<= 1;
                        exponent--;
                    }
                    mantissa &= 0x7FFFFF;
                }
            } else if (exponent !== 255) {
                // 规格化数
                exponent -= 127; // 调整指数偏移
            } else {
                // NaN 或无穷大
                return value; // 直接返回原始值
            }

            // 转换为 float16
            exponent = Math.max(-14, Math.min(15, exponent)); // 限制在 float16 的范围内
            const float16Bits = (sign >> 16) | ((exponent + 15) << 10) | (mantissa >> 13); // 组合 float16 的位表示
            view.setUint16(0, float16Bits, true); // 设置 float16 的位表示
            return view.getFloat32(0, true); // 返回 float16 的近似值
        }
    </script>

</body>

</html>
